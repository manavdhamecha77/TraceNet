# MediaMTX Configuration for DRISHTI Realtime WebRTC Streaming

# RTSP is used only internally (chunker.py / inference_worker.py pull the
# published stream back over "-rtsp_transport tcp"), so restrict to TCP —
# this avoids opening/validating unused UDP RTP/RTCP ports.
rtspTransports: [tcp]

authMethod: http
authHTTPAddress: http://localhost:8000/api/v1/stream/mediamtx-auth
authHTTPExclude:
  - action: api
  - action: metrics

# Enable WebRTC CORS & public STUN ICE servers for multi-device LAN access
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigin: '*'
webrtcLocalUDPAddress: :8189
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
  - url: stun:stun1.l.google.com:19302

paths:
  all:
    source: publisher
